<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memories</title>
<meta name="description" content="A digital memory book of our favourite moments.">
<meta name="theme-color" content="#f6efe4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<script>try{if(!sessionStorage.getItem("om-seen")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-on")}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="intro" id="intro" aria-hidden="true"><div class="half l"></div><div class="half r"></div><div class="intro-card"><div class="intro-title"><span>Our Memories</span></div><div class="bar"><i></i></div><p class="intro-msg" id="introMsg">Opening the album…</p></div></div>
<header class="nav" id="nav">
  <a class="brand" href="#top">Our Memories</a>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
  <nav id="menu">
    <a href="#collection">Gallery</a>
    <a href="#about">A note for you</a>
    <span class="count" id="count" aria-live="polite"></span>
    <button class="btn-refresh" id="refresh" aria-label="Refresh photos"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span>Refresh</span></button>
  </nav>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="glow"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="fl-layer" id="heroFloat" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1 aria-label="Our Memories"><span class="w"><span>Our</span></span> <span class="w"><span>Memories</span></span></h1>
      <p class="sub">Every picture holds a moment. Every moment tells a story.</p>
      <a class="cta" href="#collection">Explore our memories</a>
    </div>
  </section>

  <section class="gallery-wrap" id="collection">
    <div class="gallery-head">
      <h2>The collection</h2>
      <p class="note" id="status">Opening the album…</p>
    </div>
    <div id="skeleton" class="masonry" aria-hidden="true"></div>
    <div id="gallery" class="masonry" hidden></div>
    <div id="state" class="state" hidden></div>
  </section>

  <section class="note" id="about">
    <div class="env-wrap" id="envWrap">
      <button class="envelope" id="envelope" type="button" aria-label="Open the note"><span class="env-back"></span><span class="env-letter"><i></i><i></i><i></i></span><span class="env-front"></span><span class="env-flap"></span><span class="env-seal">♡</span></button>
      <p class="env-hint" id="envHint">A little note, just for you</p>
    </div>
    <article class="paper" id="paper" hidden><h3 id="noteTo"></h3><div id="noteBody"></div><p class="sign" id="noteSign"></p></article>
  </section>
</main>

<footer><span>Made with love · Our Memories</span></footer>
<button class="totop" id="totop" aria-label="Back to top">↑</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">›</button>
  <div class="lb-stage"><div class="lb-spin"></div><img id="lb-img" alt=""><iframe id="lb-frame" title="Video player" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  <div class="lb-cap"><span id="lb-name"></span><span id="lb-pos"></span></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
