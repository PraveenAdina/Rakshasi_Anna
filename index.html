<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Memories</title>
<meta name="description" content="A photo album of our favourite moments.">
<meta name="theme-color" content="#4a3223">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="btn-refresh fab" id="refresh" type="button" aria-label="Refresh photos"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span id="count"></span></button>

<main class="desk">
  <div id="skeleton" class="sk-wrap" aria-hidden="true"></div>
  <div id="gallery" class="album-host" hidden></div>
  <div id="state" class="state" hidden></div>
  <p id="status" class="sr" role="status"></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">›</button>
  <div class="lb-stage"><div class="lb-spin"></div><img id="lb-img" alt=""><iframe id="lb-frame" title="Video player" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  <div class="lb-cap"><span id="lb-name"></span><span id="lb-pos"></span></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
